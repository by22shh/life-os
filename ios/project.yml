name: LifeOS
options:
  bundleIdPrefix: com.lifeos
  deploymentTarget:
    iOS: "17.0"
    watchOS: "9.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  SWIFT_VERSION: "6.0"
  GENERATE_INFOPLIST_FILE: YES
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture.git
    from: "1.17.1"

targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: LifeOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LifeOS/App/Info.plist
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: LifeOS/App/LifeOS.entitlements
        APP_STORE_ID: ""
        APP_STORE_URL: ""
      configs:
        Debug:
          APS_ENVIRONMENT: development
          SUPABASE_URL: https://localhost.invalid
          SUPABASE_ANON_KEY: development-missing-anon-key
        Release:
          APS_ENVIRONMENT: production
          SUPABASE_URL: $(LIFEOS_SUPABASE_URL)
          SUPABASE_ANON_KEY: $(LIFEOS_SUPABASE_ANON_KEY)
    resources:
      - path: LifeOS/App/PrivacyInfo.xcprivacy
    dependencies:
      - target: GuardianMonitorExtension
        embed: true
      - target: LifeOSWidgets
        embed: true
      - package: GRDB
        product: GRDB
      - package: Supabase
        product: Supabase
      - package: ComposableArchitecture
        product: ComposableArchitecture

  GuardianMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: GuardianMonitorExtension
      - path: LifeOS/Modules/Shared/Guardian/GuardianMonitorIdentifiers.swift
    resources:
      - path: GuardianMonitorExtension/PrivacyInfo.xcprivacy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.app.guardianmonitor
      INFOPLIST_FILE: GuardianMonitorExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: GuardianMonitorExtension/GuardianMonitorExtension.entitlements
      SKIP_INSTALL: NO

  LifeOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LifeOSWidgets
      - path: LifeOS/Modules/Shared/Widgets/WidgetSnapshotShared.swift
    resources:
      - path: LifeOSWidgets/PrivacyInfo.xcprivacy
      - path: LifeOS/Resources/Localizable.xcstrings
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.app.widgets
      INFOPLIST_FILE: LifeOSWidgets/Info.plist
      CODE_SIGN_ENTITLEMENTS: LifeOSWidgets/LifeOSWidgets.entitlements
      SKIP_INSTALL: NO

  LifeOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LifeOSTests
    dependencies:
      - target: LifeOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.tests

  LifeOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LifeOSUITests
    dependencies:
      - target: LifeOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.uitests

  LifeOSWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LifeOSWidgetsTests
    dependencies:
      - target: LifeOS
      - target: LifeOSWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.widgettests
      BUNDLE_LOADER: $(TEST_HOST)
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/LifeOS.app/LifeOS
      TEST_TARGET_NAME: LifeOSWidgets
      LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - "@executable_path/Frameworks"
        - "@loader_path/Frameworks"
        - "@loader_path/../../PlugIns/LifeOSWidgets.appex"
      OTHER_LDFLAGS:
        - $(inherited)
        - $(BUILT_PRODUCTS_DIR)/LifeOSWidgets.appex/LifeOSWidgets.debug.dylib

  LifeOSWatch:
    type: application
    platform: watchOS
    sources:
      - path: ../watch/LifeOSWatchApp
        excludes:
          - README.md
    resources:
      - path: ../watch/LifeOSWatchApp/PrivacyInfo.xcprivacy
      - path: LifeOS/Resources/Localizable.xcstrings
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.app.watch
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.lifeos.app
      CODE_SIGN_ENTITLEMENTS: ../watch/LifeOSWatchApp/LifeOSWatch.entitlements
    dependencies:
      - target: LifeOSComplications
        embed: true

  LifeOSComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: ../watch/LifeOSComplications
        excludes:
          - README.md
    resources:
      - path: ../watch/LifeOSComplications/PrivacyInfo.xcprivacy
      - path: LifeOS/Resources/Localizable.xcstrings
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.app.watch.complications
      INFOPLIST_FILE: ../watch/LifeOSComplications/Info.plist
      CODE_SIGN_ENTITLEMENTS: ../watch/LifeOSComplications/LifeOSComplications.entitlements
      SKIP_INSTALL: NO

  LifeOSWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: ../watch/LifeOSWatchTests
    dependencies:
      - target: LifeOSWatch
      - target: LifeOSComplications
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.watchtests
      BUNDLE_LOADER: $(TEST_HOST)
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/LifeOSWatch.app/LifeOSWatch
      TEST_TARGET_NAME: LifeOSWatch
      LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - "@executable_path/Frameworks"
        - "@loader_path/Frameworks"
        - "@loader_path/../../PlugIns/LifeOSComplications.appex"
      OTHER_LDFLAGS:
        - $(inherited)
        - $(BUILT_PRODUCTS_DIR)/LifeOSComplications.appex/LifeOSComplications.debug.dylib

schemes:
  LifeOS:
    build:
      targets:
        LifeOS: all
        GuardianMonitorExtension: all
        LifeOSWidgets: all
        LifeOSWatch: all
        LifeOSComplications: all
        LifeOSTests: [test]
        LifeOSWidgetsTests: [test]
        LifeOSUITests: [test]
    test:
      macroExpansion: LifeOS
      targets:
        - LifeOSTests
        - LifeOSWidgetsTests
        - LifeOSUITests
    run:
      config: Debug
      executable: LifeOS
  LifeOSWatch:
    build:
      targets:
        LifeOSWatch: all
        LifeOSComplications: all
        LifeOSWatchTests: [test]
    test:
      macroExpansion: LifeOSWatch
      targets:
        - LifeOSWatchTests
    run:
      config: Debug
      executable: LifeOSWatch
