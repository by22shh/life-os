name: release-gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PREFERRED_IOS_SIMULATOR: "iPhone 16"
  PREFERRED_WATCHOS_SIMULATOR: "Apple Watch Series 10"

jobs:
  ios-unit-tests:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select iOS simulator
        shell: bash
        run: |
          SIM_NAME="$(xcrun simctl list devices available | awk -F '[()]' -v preferred="$PREFERRED_IOS_SIMULATOR" '
            /iPhone/ {
              name = $1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name == preferred) { print name; found = 1; exit }
              if (first == "") { first = name }
            }
            END { if (!found && first != "") print first }
          ')"
          if [[ -z "$SIM_NAME" ]]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          echo "Using simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Run iOS unit and widget tests
        shell: bash
        run: |
          DERIVED_DATA_DIR="$HOME/Library/Developer/Xcode/DerivedData/lifeos-ios-unit-tests"
          RESULT_BUNDLE="${RUNNER_TEMP}/lifeos-ios-unit-tests.xcresult"

          echo "Using simulator: $SIM_NAME"
          echo "Using DerivedData: $DERIVED_DATA_DIR"

          xcodebuild test \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project ios/LifeOS.xcodeproj \
            -scheme LifeOS \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -derivedDataPath "$DERIVED_DATA_DIR" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:LifeOSTests \
            -only-testing:LifeOSWidgetsTests

      - name: Upload xcresult bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-ios-unit-tests-xcresult
          path: ${{ runner.temp }}/lifeos-ios-unit-tests.xcresult
          if-no-files-found: ignore

  ios-ui-tests:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select iOS simulator
        shell: bash
        run: |
          SIM_NAME="$(xcrun simctl list devices available | awk -F '[()]' -v preferred="$PREFERRED_IOS_SIMULATOR" '
            /iPhone/ {
              name = $1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name == preferred) { print name; found = 1; exit }
              if (first == "") { first = name }
            }
            END { if (!found && first != "") print first }
          ')"
          if [[ -z "$SIM_NAME" ]]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          echo "Using simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Run iOS UI tests
        shell: bash
        run: |
          DERIVED_DATA_DIR="$HOME/Library/Developer/Xcode/DerivedData/lifeos-ios-ui-tests"
          RESULT_BUNDLE="${RUNNER_TEMP}/lifeos-ios-ui-tests.xcresult"

          echo "Using simulator: $SIM_NAME"
          echo "Using DerivedData: $DERIVED_DATA_DIR"

          xcodebuild test \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project ios/LifeOS.xcodeproj \
            -scheme LifeOS \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -derivedDataPath "$DERIVED_DATA_DIR" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:LifeOSUITests

      - name: Upload xcresult bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-ios-ui-tests-xcresult
          path: ${{ runner.temp }}/lifeos-ios-ui-tests.xcresult
          if-no-files-found: ignore

  ios-accessibility-audit:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select iOS simulator
        shell: bash
        run: |
          SIM_NAME="$(xcrun simctl list devices available | awk -F '[()]' -v preferred="$PREFERRED_IOS_SIMULATOR" '
            /iPhone/ {
              name = $1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name == preferred) { print name; found = 1; exit }
              if (first == "") { first = name }
            }
            END { if (!found && first != "") print first }
          ')"
          if [[ -z "$SIM_NAME" ]]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          echo "Using simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Run iOS accessibility release-blocker audit
        shell: bash
        run: |
          DERIVED_DATA_DIR="$HOME/Library/Developer/Xcode/DerivedData/lifeos-ios-accessibility-audit"

          echo "Using simulator: $SIM_NAME"
          echo "Using DerivedData: $DERIVED_DATA_DIR"

          xcodebuild test \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project ios/LifeOS.xcodeproj \
            -scheme LifeOS \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -derivedDataPath "$DERIVED_DATA_DIR" \
            -only-testing:LifeOSUITests/AccessibilityAuditUITests

  ios-performance-hard-gates:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select iOS simulator
        shell: bash
        run: |
          SIM_NAME="$(xcrun simctl list devices available | awk -F '[()]' -v preferred="$PREFERRED_IOS_SIMULATOR" '
            /iPhone/ {
              name = $1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name == preferred) { print name; found = 1; exit }
              if (first == "") { first = name }
            }
            END { if (!found && first != "") print first }
          ')"
          if [[ -z "$SIM_NAME" ]]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          echo "Using simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Run iOS performance hard-gates
        env:
          LIFEOS_STARTUP_BUDGET_MS: "4000"
          LIFEOS_SYNC_LATENCY_BUDGET_MS: "2500"
          LIFEOS_SYNC_MEMORY_BUDGET_MB: "450"
        shell: bash
        run: |
          set -o pipefail
          bash scripts/run_ios_performance_hard_gates.sh 2>&1 | tee "${RUNNER_TEMP}/lifeos-ios-performance-hard-gates.log"

      - name: Upload performance hard-gates log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-ios-performance-hard-gates-log
          path: ${{ runner.temp }}/lifeos-ios-performance-hard-gates.log
          if-no-files-found: ignore

  ios-analyze:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select iOS simulator
        shell: bash
        run: |
          SIM_NAME="$(xcrun simctl list devices available | awk -F '[()]' -v preferred="$PREFERRED_IOS_SIMULATOR" '
            /iPhone/ {
              name = $1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name == preferred) { print name; found = 1; exit }
              if (first == "") { first = name }
            }
            END { if (!found && first != "") print first }
          ')"
          if [[ -z "$SIM_NAME" ]]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          echo "Using simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Run iOS static analyze
        shell: bash
        run: |
          DERIVED_DATA_DIR="$HOME/Library/Developer/Xcode/DerivedData/lifeos-ios-analyze"

          echo "Using simulator: $SIM_NAME"
          echo "Using DerivedData: $DERIVED_DATA_DIR"

          xcodebuild analyze \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project ios/LifeOS.xcodeproj \
            -scheme LifeOS \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -derivedDataPath "$DERIVED_DATA_DIR"

  ios-release-config-guard:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release config and privacy manifests
        run: bash scripts/check_ios_release_config.sh

  watchos-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build watchOS target
        shell: bash
        run: |
          DERIVED_DATA_DIR="$HOME/Library/Developer/Xcode/DerivedData/lifeos-watch-build"
          echo "Using DerivedData: $DERIVED_DATA_DIR"

          xcodebuild build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project ios/LifeOS.xcodeproj \
            -scheme LifeOSWatch \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_DIR"

  watchos-tests:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select watchOS simulator
        shell: bash
        run: |
          WATCH_NAME="$(xcrun simctl list devices available | awk -F '[()]' -v preferred="$PREFERRED_WATCHOS_SIMULATOR" '
            /Apple Watch/ {
              name = $1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name == preferred) { print name; found = 1; exit }
              if (first == "") { first = name }
            }
            END { if (!found && first != "") print first }
          ')"
          if [[ -z "$WATCH_NAME" ]]; then
            echo "No available Apple Watch simulator found"
            exit 1
          fi

          echo "Using watch simulator: $WATCH_NAME"
          echo "WATCH_NAME=$WATCH_NAME" >> "$GITHUB_ENV"

      - name: Run watchOS tests
        shell: bash
        run: |
          DERIVED_DATA_DIR="$HOME/Library/Developer/Xcode/DerivedData/lifeos-watch-tests"

          echo "Using watch simulator: $WATCH_NAME"
          echo "Using DerivedData: $DERIVED_DATA_DIR"

          xcodebuild test \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project ios/LifeOS.xcodeproj \
            -scheme LifeOSWatch \
            -destination "platform=watchOS Simulator,name=${WATCH_NAME}" \
            -derivedDataPath "$DERIVED_DATA_DIR" \
            -only-testing:LifeOSWatchTests

  deno-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno fmt --check
        run: deno fmt --check supabase/functions

      - name: deno lint
        run: deno lint supabase/functions

      - name: deno check
        shell: bash
        run: find supabase/functions -type f -name '*.ts' -print0 | xargs -0 deno check

      - name: deno test
        run: deno test -A supabase/functions/tests

  supabase-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start --workdir .

      - name: Lint DB schema
        run: supabase db lint --workdir .

      - name: Reset DB from migrations
        run: supabase db reset --workdir . --no-seed --yes

      - name: Verify PostgREST table grants
        run: bash scripts/check_supabase_table_grants.sh

      - name: Stop local Supabase
        if: always()
        run: supabase stop --workdir . --no-backup --yes

  supabase-edge-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run local Supabase edge e2e
        run: bash scripts/run_supabase_edge_e2e.sh

  supabase-edge-load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run local Supabase edge load test
        env:
          EDGE_LOAD_FOOD_REQUESTS: "120"
          EDGE_LOAD_SETTINGS_REQUESTS: "90"
          EDGE_LOAD_CONCURRENCY: "16"
          EDGE_LOAD_FOOD_P95_MS: "1200"
          EDGE_LOAD_SETTINGS_P95_MS: "800"
          EDGE_LOAD_MAX_ERROR_RATE: "0"
        run: bash scripts/run_supabase_edge_load.sh

  security-preprod-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run pre-prod security pass
        env:
          SECURITY_PASS_SKIP_EDGE_E2E: "1"
        run: bash scripts/run_preprod_security_pass.sh

  # Optional: skipped entirely unless all three staging secrets are configured.
  # The aggregate release-gate job tolerates "skipped" but fails on "failure".
  supabase-staging-deploy:
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_STAGING_PROJECT_ID != '' && secrets.SUPABASE_STAGING_DB_PASSWORD != '' }}
    needs:
      - deno-gates
      - supabase-db
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_STAGING_PROJECT_ID" --workdir .

      - name: Push DB migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: supabase db push --workdir .

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_STAGING_PROJECT_ID" --workdir .

  release-gate:
    if: always()
    needs:
      - ios-unit-tests
      - ios-ui-tests
      - ios-accessibility-audit
      - ios-performance-hard-gates
      - ios-analyze
      - ios-release-config-guard
      - watchos-build
      - watchos-tests
      - deno-gates
      - supabase-db
      - supabase-edge-e2e
      - supabase-edge-load
      - security-preprod-pass
      - supabase-staging-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        shell: bash
        run: |
          if [[ "${{ needs.ios-unit-tests.result }}" != "success" ]]; then
            echo "ios-unit-tests failed"
            exit 1
          fi
          if [[ "${{ needs.ios-ui-tests.result }}" != "success" ]]; then
            echo "ios-ui-tests failed"
            exit 1
          fi
          if [[ "${{ needs.ios-accessibility-audit.result }}" != "success" ]]; then
            echo "ios-accessibility-audit failed"
            exit 1
          fi
          if [[ "${{ needs.ios-performance-hard-gates.result }}" != "success" ]]; then
            echo "ios-performance-hard-gates failed"
            exit 1
          fi
          if [[ "${{ needs.ios-analyze.result }}" != "success" ]]; then
            echo "ios-analyze failed"
            exit 1
          fi
          if [[ "${{ needs.ios-release-config-guard.result }}" != "success" ]]; then
            echo "ios-release-config-guard failed"
            exit 1
          fi
          if [[ "${{ needs.watchos-build.result }}" != "success" ]]; then
            echo "watchos-build failed"
            exit 1
          fi
          if [[ "${{ needs.watchos-tests.result }}" != "success" ]]; then
            echo "watchos-tests failed"
            exit 1
          fi
          if [[ "${{ needs.deno-gates.result }}" != "success" ]]; then
            echo "deno-gates failed"
            exit 1
          fi
          if [[ "${{ needs.supabase-db.result }}" != "success" ]]; then
            echo "supabase-db failed"
            exit 1
          fi
          if [[ "${{ needs.supabase-edge-e2e.result }}" != "success" ]]; then
            echo "supabase-edge-e2e failed"
            exit 1
          fi
          if [[ "${{ needs.supabase-edge-load.result }}" != "success" ]]; then
            echo "supabase-edge-load failed"
            exit 1
          fi
          if [[ "${{ needs.security-preprod-pass.result }}" != "success" ]]; then
            echo "security-preprod-pass failed"
            exit 1
          fi
          # Optional job: skipped (secrets not configured) is fine, failed is not.
          staging_result="${{ needs.supabase-staging-deploy.result }}"
          case "$staging_result" in
            success|skipped)
              echo "supabase-staging-deploy: $staging_result"
              ;;
            *)
              echo "supabase-staging-deploy failed ($staging_result)"
              exit 1
              ;;
          esac
          echo "Release gate passed"
